[project]
name = "pomodoro-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "aldoroshenko",email = "aldoroshenko@neoflex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "response (>=0.5.0,<0.6.0)",
    "requests (>=2.32.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pytest[async] (>=8.4.1,<9.0.0)",
    "twisted (>=25.5.0,<26.0.0)",
    "pytest-twisted (>=1.14.3,<2.0.0)",
    "pytest-factoryboy (>=2.8.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "pomodoro_poetry", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
